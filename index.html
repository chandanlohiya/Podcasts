<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PodStream - Free Podcasts</title>
    <style>
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8;
        }
        body {
            font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 16px; max-width: 1000px; margin: 0 auto;
        }
        header { text-align: center; padding: 20px 0; }
        h1 { margin: 0; font-size: 1.8rem; color: var(--accent); }
        .search-box { display: flex; gap: 10px; margin: 20px 0; }
        input { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: var(--card-bg); color: white; font-size: 1rem; }
        button { padding: 14px 20px; border-radius: 10px; border: none; background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; }
        .player-container {
            margin-bottom: 30px; position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; background: #000; display: none; overflow: hidden;
        }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; cursor: pointer; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-body { padding: 12px; }
        .card-title { font-size: 0.95rem; font-weight: 600; margin: 0 0 8px 0; line-height: 1.3; }
        .card-channel { font-size: 0.8rem; color: var(--muted); margin: 0; }
    </style>
</head>
<body>

    <header>
        <h1>🎙️ PodStream</h1>
        <p style="color: var(--muted); margin-top: 5px;">100% Free Long-form Podcasts & Audiobooks</p>
    </header>

    <div class="search-box">
        <input type="text" id="topicInput" placeholder="Search a topic (e.g., Space, History)...">
        <button onclick="searchPodcasts()">Search</button>
    </div>

    <!-- Active Video Player -->
    <div class="player-container" id="playerWrapper">
        <iframe id="videoPlayer" allowfullscreen></iframe>
    </div>

    <!-- Search Results -->
    <div class="grid" id="results"></div>
        <script>
        async function searchPodcasts() {
            const topic = document.getElementById("topicInput").value.trim();
            const resultsDiv = document.getElementById("results");

            if (!topic) return alert("Please enter a topic to search!");

            resultsDiv.innerHTML = "<p style='color: var(--muted);'>Connecting to secure servers...</p>";

            try {
                // Switching to the Piped network, which allows browser connections without security blocks
                const url = `https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(topic + " podcast")}&filter=videos`;
                
                const response = await fetch(url);
                const data = await response.json();

                resultsDiv.innerHTML = "";

                // Manually filter out Shorts and short clips (only keep videos longer than 20 mins / 1200 seconds)
                const longVideos = data.items.filter(item => item.duration > 1200);

                if (longVideos.length === 0) {
                    resultsDiv.innerHTML = "<p style='color: var(--muted);'>No long podcasts found for this topic. Try a broader search!</p>";
                    return;
                }

                // Show the top 12 results
                longVideos.slice(0, 12).forEach(item => {
                    // Extract the exact video ID
                    const videoId = item.url.split("v=")[1].split("&")[0]; 
                    const title = item.title;
                    const channel = item.uploaderName;
                    const thumbnail = item.thumbnail;

                    const card = document.createElement("div");
                    card.className = "card";
                    card.onclick = () => playVideo(videoId);

                    card.innerHTML = `
                        <img src="${thumbnail}" alt="Thumbnail">
                        <div class="card-body">
                            <h3 class="card-title">${title}</h3>
                            <p class="card-channel">${channel} • ${Math.floor(item.duration / 60)} mins</p>
                        </div>
                    `;

                    resultsDiv.appendChild(card);
                });

            } catch (err) {
                resultsDiv.innerHTML = "<p style='color: red;'>Connection failed. The free server might be temporarily busy, please try again in a minute!</p>";
                console.error("Error details:", err);
            }
        }

        function playVideo(videoId) {
            const playerWrapper = document.getElementById("playerWrapper");
            const iframe = document.getElementById("videoPlayer");

            // Embed the video directly
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            playerWrapper.style.display = "block";
            playerWrapper.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
