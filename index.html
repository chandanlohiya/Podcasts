<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PodStream - Pro Version</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 16px; max-width: 1000px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0 10px 0; }
        h1 { margin: 0; font-size: 1.8rem; color: var(--accent); }
        
        .api-box { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        .api-box p { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--accent); }
        .api-input-group { display: flex; gap: 10px; }
        .api-input-group input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #0f172a; color: white; }
        .api-input-group button { padding: 10px 15px; border-radius: 6px; border: none; background: var(--muted); color: white; cursor: pointer; }
        
        .search-box { display: flex; gap: 10px; margin: 0 0 20px 0; }
        .search-box input { flex: 1; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: var(--card-bg); color: white; font-size: 1rem; }
        .search-box button { padding: 14px 20px; border-radius: 10px; border: none; background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; }
        
        .player-container { margin-bottom: 30px; position: relative; padding-bottom: 56.25%; height: 0; border-radius: 12px; background: #000; display: none; overflow: hidden; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; cursor: pointer; }
        .card img { width: 100%; height: 150px; object-fit: cover; }
        .card-body { padding: 12px; }
        .card-title { font-size: 0.95rem; font-weight: 600; margin: 0 0 8px 0; line-height: 1.3; }
        .card-channel { font-size: 0.8rem; color: var(--muted); margin: 0; }
    </style>
</head>
<body>

    <header>
        <h1>🎙️ PodStream</h1>
    </header>

    <!-- Key setup -->
    <div class="api-box" id="apiBox">
        <p>🔑 Enter your free YouTube API Key to unlock searches:</p>
        <div class="api-input-group">
            <input type="text" id="apiKeyInput" placeholder="Paste your key here...">
            <button onclick="saveApiKey()">Save Key</button>
        </div>
    </div>

    <div class="search-box">
        <input type="text" id="topicInput" placeholder="Search a topic (e.g., Space, AI, History)...">
        <button onclick="searchPodcasts()">Search</button>
    </div>

    <!-- Active Video Player -->
    <div class="player-container" id="playerWrapper">
        <iframe id="videoPlayer" allowfullscreen></iframe>
    </div>

    <!-- Search Results -->
    <div class="grid" id="results"></div>

    <script>
        // Check for saved key when page loads
        document.addEventListener("DOMContentLoaded", () => {
            const savedKey = localStorage.getItem("yt_api_key");
            if (savedKey) {
                document.getElementById("apiKeyInput").value = savedKey;
                document.getElementById("apiBox").style.display = "none"; // Hide box if key exists
            }
        });

        function saveApiKey() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (key) {
                localStorage.setItem("yt_api_key", key);
                alert("Key saved! You can now search.");
                document.getElementById("apiBox").style.display = "none";
            }
        }

        async function searchPodcasts() {
            const topic = document.getElementById("topicInput").value.trim();
            const apiKey = localStorage.getItem("yt_api_key");
            const resultsDiv = document.getElementById("results");

            if (!apiKey) return alert("Please paste your free YouTube API key first!");
            if (!topic) return alert("Please enter a topic to search!");

            resultsDiv.innerHTML = "<p style='color: var(--muted);'>Searching YouTube...</p>";

            try {
                // Official YouTube API: Fast, reliable, never blocks you!
                // videoDuration=long filters out shorts and clips under 20 minutes
                const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(topic)}&type=video&videoDuration=long&maxResults=12&key=${apiKey}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if (data.error) {
                    resultsDiv.innerHTML = `<p style='color: red;'>API Error: ${data.error.message}</p>`;
                    // Show the API box again so you can fix the key
                    document.getElementById("apiBox").style.display = "block";
                    return;
                }

                resultsDiv.innerHTML = "";

                data.items.forEach(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title;
                    const channel = item.snippet.channelTitle;
                    const thumbnail = item.snippet.thumbnails.medium.url;

                    const card = document.createElement("div");
                    card.className = "card";
                    card.onclick = () => playVideo(videoId);

                    card.innerHTML = `
                        <img src="${thumbnail}" alt="Thumbnail">
                        <div class="card-body">
                            <h3 class="card-title">${title}</h3>
                            <p class="card-channel">${channel}</p>
                        </div>
                    `;

                    resultsDiv.appendChild(card);
                });

            } catch (err) {
                resultsDiv.innerHTML = "<p style='color: red;'>Failed to connect to YouTube.</p>";
            }
        }

        function playVideo(videoId) {
            const playerWrapper = document.getElementById("playerWrapper");
            const iframe = document.getElementById("videoPlayer");
            iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            playerWrapper.style.display = "block";
            playerWrapper.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
